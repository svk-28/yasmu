daemon:
  check_timeout: 10
  log_file: watchdog.log
  work_dir: ./

checks:
    process:
        enable: false
    users:
        enable: false
    network:
        enable: false
    ports:
        enable: false
    web:
      enable: true
      urls:
        - https://nuk-svk.ru/health
        - https://git.nuk-svk.ru/api/healthz
        - https://files.nuk-svk.ru/health
        - https://chat.nuk-svk.ru
    files:
      enable: true
      paths:
        - path: /etc
          watch: [create, modify, delete]
        - path: /dev
          watch: [create, delete]
          exclude:
            - /dev/pts
            - /dev/tty
    cron:
        enable: false

notify:
    email:
        enable: false
        server: smtp.server.com
        port: 465
        user: user
        password: "12345678"
        mail_to: to@domain.com
        mail_from: from@domain.com
        mail_subject: "Alert message from %HOSTNAME%"

    matrix:
        enable: false
        server: matrix.server.com
        user: user
        password: "12345678"
        chat_id: 1qu2ueu4383jr4o83

    webhook:
        enable: false
        url: https://web.server.com/hook
        user: user
        password: "12345678"
